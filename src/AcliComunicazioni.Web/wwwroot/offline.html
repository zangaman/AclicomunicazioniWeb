<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#117b8d">
    <title>Connessione assente - AcliComunicazioni</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f7f9; color: #102848; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(100%, 420px); padding: 32px 28px; border: 1px solid #d9e3e8; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 16px 40px rgba(16, 40, 72, .08); }
        .mark { display: grid; width: 56px; height: 56px; margin: 0 auto 24px; place-items: center; border-radius: 15px; background: #117b8d; color: white; font-weight: 800; font-size: 20px; }
        h1 { margin: 0 0 10px; font-size: 24px; }
        p { margin: 0 0 24px; color: #607286; line-height: 1.55; }
        button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: #117b8d; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">AC</div>
        <h1>Connessione assente</h1>
        <p>Per consultare o registrare le percorrenze è necessaria una connessione a Internet.</p>
        <button type="button" onclick="location.reload()">Riprova</button>
    </main>
</body>
</html>
